<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>

        body{
            background-color: white;
            color: rgb(45, 45, 75);
        }

        .text {
            font-size: 30px;
            margin-left: 30px;
            background-color: #e2d5d5;
            border-radius: 15px;
            width: 50vh;
            text-align: center;

        }

        .container {
            display: flex;
            justify-content: space-between;
            padding: 50px;
            max-width: 1100px;
        }

        .info {
            margin-top: 20px;
        }

        .right {
            width: 90%;
            background: #e2d5d5;
            padding: 20px;
            border-radius: 15px;
        }


        input,textarea {
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
        }

        textarea {
            height: 30px;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        
    </style>


<body>
    <header class="text">
        <h1>Contact Us</h1>
    </header>
    <main>
        
        <div class="container">
                <h5>WE ARE HERE TO HELP YOU</h5>
                <h1><span>Have a recipe?</span>Send it and we will count the Calories for you!</h1>
                <div class="info">
                    <h4>&#9993; healthyfood@gmail.com</h4>
                    <h4>&#128222; +95632xxxxxx7</h4>
                </div>
                <div class="right">
                     <form id="cantactform">
                    <label>Name</label>
                    <input type="text" placeholder="Enter your name"
                    <label>Email</label>
                    <input type="email" placeholder="email@gmail.">
                    <label>Message</label>
                    <textarea id="message" placeholder="type your message"></textarea>
                    <button type="submit">Submit</button>
                </form>
                </div>
            </div>

       
    </main>


</body>
