<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Healthy Food Recipes</title>
    <link rel="stylesheet" href="style.css">
</head>




    
<body>
<header>
    <nav class="navbar main-content">
        <div class="brand">
            <span>Healthy Food Recipes</span>
        </div>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="breakfast.html">Breakfast</a>
            <a href="lunch.html">Lunch</a>
            <a href="dinner.html">Dinner</a>
            <a href="drinks.html">Drinks</a>
        </div>
    </nav>
</header>



    
<main class="main-content">
    <section class="recipe-card" style="max-width: 430px; margin: 60px auto;">
        <div class="card-content">
            <h2 class="card-title">Create an Account</h2>
            <p class="card-subtitle">Join us and discover healthy recipes.</p>

            <form action="home.html">
                <input type="text" placeholder="Full Name" required
                    style="width:100%; padding:14px; margin-bottom:15px; border:none; border-radius:16px; font-size:15px;">

                <input type="email" placeholder="Email Address" required
                    style="width:100%; padding:14px; margin-bottom:15px; border:none; border-radius:16px; font-size:15px;">

                <input type="password" placeholder="Password" required
                    style="width:100%; padding:14px; margin-bottom:20px; border:none; border-radius:16px; font-size:15px;">

                <button class="view-btn" type="submit">Register</button>
            </form>

            <p class="card-subtitle" style="margin-top:15px;">
                Your journey to healthy eating starts here.
            </p>

        </div>
    </section>
</main>



    
<footer>
    © 2026 Healthy Food Recipes
</footer>



    
</body>
</html>
